# Taxonomia de FIDCs
# ==================
# Cada fundo recebe a PRIMEIRA categoria (na ordem abaixo) cuja regra bate.
# Ajuste manual feito no app sempre ganha das regras.
#
# Para criar uma categoria nova: copie um bloco, dê um id único e escreva as regras.
# Não precisa mexer em código. Rode o build de novo (ou "Reclassificar" no app).
#
# Uma categoria tem uma lista `regras`; basta UMA regra bater (OU).
# Dentro de uma regra, TODAS as condições precisam bater (E). Condições disponíveis:
#
#   nome_inclui:  [regex, ...]   nome do fundo contém algum dos termos (sem acento, maiúsculo)
#   nome_exclui:  [regex, ...]   nome NÃO contém nenhum dos termos
#   segmento_min: {segmentos: [F2, ...], pct: 0.5}
#                 soma da participação desses segmentos da Tabela II na carteira >= pct
#   top1_cedente_max / top1_cedente_min: % do maior cedente (Tabela I, 0-100)
#   cotas_fidc_min: participação de cotas de FIDC no ativo (0-1)
#   aquisicao_inad_min: aquisições de créditos já inadimplentes / aquisições totais, 12m (0-1)
#   sem_carteira: true  -> fundo sem direitos creditórios na Tabela II
#   sem_cedente: true -> o informe não lista nenhum cedente (ninguém relevante: típico de carteira pulverizada)
#   pmr_min / pmr_max: prazo médio a vencer da carteira, em dias (faixas da Tab. V/VI)
#   taxa_min / taxa_max: taxa média de aquisição da Tab. IX, % a.a. (só quando entre 12% e 100%)
#   reg_min:   {sinal: n, ...}  o regulamento vigente (FNET) menciona o sinal pelo menos n vezes
#   reg_max:   {sinal: n, ...}  ... no máximo n vezes (fundo sem regulamento lido passa)
#   ia_tese: [...] / ia_consignado: [...] / ia_confianca_min: media   leitura do regulamento por IA
#   usar_tese_ia: true (no nível da categoria)  a categoria final é a tese lida pela IA
#   com_regulamento: true   só vale para fundo com regulamento lido
#   reg_maior: {sinal: [outros]} o sinal aparece mais que a soma dos outros
#              ("a+b" soma sinais). Sinais em backend/fidc/regulamentos.py (SINAIS): consignado,
#              consig_inss, consig_servidor, consig_privado, fgts, precatorio, duplicata, ccb, cartao...
#   revisar: true  -> marca o fundo para revisão manual (classificação de baixa confiança)
#
# Segmentos da Tabela II (informe mensal CVM):
#   A indústria | B imobiliário | C1 comercial | C2 varejo | C3 arrendamento mercantil
#   D1 serviços | D2 serviços públicos | D3 educacionais | D4 entretenimento | E agronegócio
#   F1 crédito pessoal | F2 consignado | F3 corporativo | F4 middle market | F5 veículos
#   F6 imob. empresarial | F7 imob. residencial | F8 outros financeiros | G cartão de crédito
#   H1 factoring PF | H2 factoring PJ | I1 precatórios | I2 tributários | I3 royalties | I4 outros setor público
#   J ações judiciais | K propriedade intelectual/marcas

cortes:
  dominante: 0.5               # segmento "dominante" = >= 50% da carteira
  multicedente_top1_max: 15    # multicedente: maior cedente <= 15% (proposta inicial, calibrar)
  monocedente_top1_min: 50     # mono-cedente: maior cedente >= 50%

categorias:

  - id: fic_fidc
    nome: FIC-FIDC
    grupo: Estruturas
    regras:
      - cotas_fidc_min: 0.5
      - nome_inclui: ['\bFIC\b', 'COTAS DE FUNDOS? DE INVESTIMENTO EM DIREITOS']

  - id: precatorios_federais
    nome: Precatórios federais
    grupo: Setor público e judicial
    regras:
      - ia_tese: [precatorios, judicial, setor_publico_outros]
        ia_foco_precatorio: [federal]
        ia_confianca_min: media
      - segmento_min: {segmentos: [I1], pct: 0.5}
        reg_min: {prec_federal: 2}
        reg_maior: {prec_federal: [prec_estadual]}
      - nome_inclui: ['PRECAT']
        reg_min: {prec_federal: 2}
        reg_maior: {prec_federal: [prec_estadual]}
      - nome_inclui: ['PRECAT\w* FEDERA', 'FEDERA\w* PRECAT']

  - id: precatorios
    nome: Precatórios (estaduais, municipais ou foco não identificado)
    grupo: Setor público e judicial
    regras:
      - segmento_min: {segmentos: [I1], pct: 0.5}
      - nome_inclui: ['PRECAT']

  - id: fgts
    nome: FGTS (antecipação saque-aniversário)
    grupo: Crédito PF
    regras:
      - nome_inclui: ['FGTS', 'SAQUE.?ANIVERSARIO']

  - id: npl
    nome: NPL / créditos estressados
    grupo: Estruturas
    regras:
      - aquisicao_inad_min: 0.5
      - nome_inclui: ['\bNPL\b', 'NON.?PERFORMING', 'ESTRESSAD', 'DISTRESS', 'RECUPERACAO DE CREDITO']

  - id: consignado_publico
    nome: Consignado público
    grupo: Consignado
    regras:
      - nome_inclui: ['\bINSS\b', 'SIAPE', 'CONSIG\w* PUBLICO', 'SERVIDOR']
        nome_exclui: ['PRIVADO', '\bCLT\b', 'TRABALHADOR']
      - segmento_min: {segmentos: [F2], pct: 0.5}
        nome_inclui: ['INSS', 'SIAPE', 'SERVIDOR', 'PUBLICO', 'GOVERNO', 'PREFEITURA', 'MUNICIP',
                      'ESTADUA', 'FEDERA', 'MILITAR', 'FORCAS ARMADAS', 'APOSENTAD', 'PENSIONISTA']

  - id: consignado_privado
    nome: Consignado privado
    grupo: Consignado
    regras:
      - nome_inclui: ['CONSIGNADO PRIVADO', '\bCLT\b', 'TRABALHADOR', 'E-?CONSIGNADO']
      - segmento_min: {segmentos: [F2], pct: 0.5}
        nome_inclui: ['PRIVADO', '\bCLT\b', 'TRABALHADOR', 'EMPRESA']

  # ---- leitura do regulamento por IA (agente_regulamento.py): vale mais que as regras de texto
  - id: consignado_privado_ia
    nome: Consignado privado
    grupo: Consignado
    alias_de: consignado_privado
    regras:
      - ia_tese: [consignado]
        ia_consignado: [privado_clt]
        ia_confianca_min: media

  - id: consignado_publico_ia
    nome: Consignado público
    grupo: Consignado
    alias_de: consignado_publico
    regras:
      - ia_tese: [consignado]
        ia_consignado: [inss, servidor_publico, publico_misto]
        ia_confianca_min: media

  - id: consignado_misto_ia
    nome: Consignado (público/privado a classificar)
    grupo: Consignado
    alias_de: consignado_indefinido
    regras:
      - ia_tese: [consignado]
        ia_consignado: [misto_publico_privado]
        ia_confianca_min: media
        revisar: true

  # segmento consignado na Tab. II, mas a IA leu outra tese no regulamento: vale a tese da IA
  - id: tese_ia_f2
    nome: (tese lida pela IA)
    grupo: Outros
    usar_tese_ia: true
    regras:
      - segmento_min: {segmentos: [F2], pct: 0.5}
        ia_consignado: [nao_e_consignado]
        ia_confianca_min: media
        revisar: true

  # ---- regulamento (FNET): a tese escrita no regulamento vale mais que a heurística de prazo/taxa
  - id: consignado_privado_reg
    nome: Consignado privado
    grupo: Consignado
    alias_de: consignado_privado
    regras:
      - segmento_min: {segmentos: [F2], pct: 0.5}
        reg_min: {consignado: 3, consig_privado: 3}
        reg_maior: {consig_privado: [consig_inss, consig_servidor]}
      # fora do segmento consignado da Tab. II: só com o regulamento claramente de consignado privado
      - reg_min: {consignado: 10, consig_privado: 10}
        reg_maior: {consig_privado: [consig_inss, consig_servidor], consignado: [fgts, veiculo]}
        revisar: true

  - id: consignado_publico_reg
    nome: Consignado público
    grupo: Consignado
    alias_de: consignado_publico
    regras:
      - segmento_min: {segmentos: [F2], pct: 0.5}
        reg_min: {consignado: 3, consig_inss+consig_servidor: 3}
        reg_maior: {consig_inss+consig_servidor: [consig_privado]}
      - reg_min: {consignado: 10, consig_inss+consig_servidor: 10}
        reg_maior: {consig_inss+consig_servidor: [consig_privado], consignado: [fgts, veiculo]}
        revisar: true

  # segmento consignado na Tab. II mas o regulamento não fala de consignado: provável erro de enquadramento
  - id: credito_pessoal_reg
    nome: Crédito pessoal / CDC
    grupo: Crédito PF
    alias_de: credito_pessoal
    regras:
      - segmento_min: {segmentos: [F2], pct: 0.5}
        reg_max: {consignado: 2}
        reg_min: {ccb: 1}
        revisar: true

  - id: outros_reg
    nome: Outros / não classificado
    grupo: Outros
    alias_de: outros
    regras:
      - segmento_min: {segmentos: [F2], pct: 0.5}
        com_regulamento: true
        reg_max: {consignado: 2}
        revisar: true

  # ---- heurísticas (sem regulamento lido ou regulamento ambíguo): revisar
  - id: consignado_privado_heur
    nome: Consignado privado
    grupo: Consignado
    alias_de: consignado_privado
    regras:
      # consignado sem pista no nome, com carteira curta ou taxa alta = perfil do privado
      - segmento_min: {segmentos: [F2], pct: 0.5}
        nome_exclui: ['INSS', 'PUBLICO', 'SERVIDOR', 'SIAPE', 'FGTS']
        pmr_max: 450
        revisar: true
      - segmento_min: {segmentos: [F2], pct: 0.5}
        nome_exclui: ['INSS', 'PUBLICO', 'SERVIDOR', 'SIAPE', 'FGTS']
        taxa_min: 40
        revisar: true

  - id: consignado_publico_heur
    nome: Consignado público
    grupo: Consignado
    alias_de: consignado_publico
    regras:
      # carteira longa ou taxa baixa = perfil de INSS / servidor
      - segmento_min: {segmentos: [F2], pct: 0.5}
        nome_exclui: ['PRIVADO', '\bCLT\b', 'TRABALHADOR']
        pmr_min: 550
        revisar: true
      - segmento_min: {segmentos: [F2], pct: 0.5}
        nome_exclui: ['PRIVADO', '\bCLT\b', 'TRABALHADOR']
        taxa_max: 32
        revisar: true
      - nome_inclui: ['CONSIG']
        nome_exclui: ['PRIVADO', '\bCLT\b', 'TRABALHADOR']
        pmr_min: 550
        revisar: true

  - id: consignado_indefinido
    nome: Consignado (público/privado a classificar)
    grupo: Consignado
    regras:
      - segmento_min: {segmentos: [F2], pct: 0.5}
        revisar: true
      - nome_inclui: ['CONSIG']
        revisar: true

  # nome explícito de veículos ganha das regras de recebíveis comerciais (ex.: PAN AUTO informa segmento C1)
  - id: veiculos_nome
    nome: Veículos
    grupo: Crédito PF
    alias_de: veiculos
    regras:
      - nome_inclui: ['\bAUTO\b', 'AUTO LOANS', 'VEICUL', 'AUTOMOV']
        nome_exclui: ['AUTOPECA', 'AUTOMACAO', 'AUTOPISTA']

  - id: cartao
    nome: Recebíveis de cartão
    grupo: Crédito PF
    regras:
      - segmento_min: {segmentos: [G], pct: 0.5}
      - nome_inclui: ['CARTAO', 'CARTOES', 'ADQUIRENCIA', 'ARRANJO']

  - id: multicedente_multissacado
    nome: Multicedente multissacado
    grupo: Recebíveis comerciais
    regras:
      # regulamento lido pela IA como MCMS e carteira sem cedente dominante
      - ia_tese: [multicedente_multissacado]
        ia_confianca_min: media
        segmento_min: {segmentos: [A, C1, C2, C3, D1, H1, H2, F8], pct: 0.5}
        top1_cedente_max: 50
      - ia_tese: [multicedente_multissacado]
        ia_confianca_min: media
        segmento_min: {segmentos: [A, C1, C2, C3, D1, H1, H2, F8], pct: 0.5}
        sem_cedente: true
      - nome_inclui: ['MULTI.?CEDENTE', 'MULTI.?SSACADO', 'MULTI.?SACADO']
      - segmento_min: {segmentos: [A, C1, C2, D1, H1, H2, F8], pct: 0.5}
        top1_cedente_max: 15
      # nenhum cedente listado no informe = nenhum cedente relevante (carteira pulverizada), ex.: MR FIDC
      - segmento_min: {segmentos: [A, C1, C2, C3, D1, H1, H2], pct: 0.5}
        sem_cedente: true
        nome_exclui: ['\bAUTO', 'VEICUL', 'MOTOS?\b', 'CONSIG', 'CARTAO', 'CARTOES', 'ENERGIA', 'SOLAR', 'IMOB',
                      '\bAGRO', 'PRECAT', 'JUDICI', 'FGTS', '\bCPR\b', 'LOCACAO', 'ALUGUE']
        reg_max: {veiculo: 15, consignado: 10, cartao: 10}
        revisar: true

  - id: risco_sacado
    nome: Risco sacado / supply chain
    grupo: Recebíveis comerciais
    regras:
      - nome_inclui: ['RISCO SACADO', 'FORNECEDOR', 'SUPPLY', 'FORFAIT', 'CADEIA']

  - id: monocedente_comercial
    nome: Recebíveis comerciais mono-cedente
    grupo: Recebíveis comerciais
    regras:
      - segmento_min: {segmentos: [A, C1, C2, C3, D1, D2, D3, D4, H1, H2], pct: 0.5}
        top1_cedente_min: 50

  - id: recebiveis_comerciais_outros
    nome: Recebíveis comerciais (pulverização intermediária)
    grupo: Recebíveis comerciais
    regras:
      - segmento_min: {segmentos: [A, C1, C2, C3, D1, D2, D3, D4, H1, H2], pct: 0.5}

  - id: credito_pessoal
    nome: Crédito pessoal / CDC
    grupo: Crédito PF
    regras:
      - segmento_min: {segmentos: [F1], pct: 0.5}

  - id: veiculos
    nome: Veículos
    grupo: Crédito PF
    regras:
      - segmento_min: {segmentos: [F5], pct: 0.5}
      - nome_inclui: ['VEICULO', 'AUTO\b', 'MOTOS?\b']

  - id: imobiliario
    nome: Imobiliário
    grupo: Imobiliário
    regras:
      - segmento_min: {segmentos: [B, F6, F7], pct: 0.5}

  - id: agro
    nome: Agronegócio
    grupo: Agro
    regras:
      - segmento_min: {segmentos: [E], pct: 0.5}
      - nome_inclui: ['\bAGRO', '\bCPR\b']

  - id: corporativo
    nome: Crédito corporativo / middle market
    grupo: Crédito PJ
    regras:
      - segmento_min: {segmentos: [F3, F4], pct: 0.5}

  - id: judicial
    nome: Direitos judiciais
    grupo: Setor público e judicial
    regras:
      - segmento_min: {segmentos: [J], pct: 0.5}
      - nome_inclui: ['JUDICI']

  - id: setor_publico_outros
    nome: Setor público (tributário, royalties, outros)
    grupo: Setor público e judicial
    regras:
      - segmento_min: {segmentos: [I2, I3, I4], pct: 0.5}

  # "Financeiro - outros" não diz o lastro: usa a tese que a IA leu no regulamento
  - id: tese_ia_outros
    nome: (tese lida pela IA)
    grupo: Outros
    usar_tese_ia: true
    regras:
      - segmento_min: {segmentos: [F8], pct: 0.5}
        ia_confianca_min: media
        revisar: true

  - id: financeiro_outros
    nome: Financeiro – outros (sem detalhe na CVM)
    grupo: Outros
    regras:
      - segmento_min: {segmentos: [F8], pct: 0.5}
        revisar: true

  - id: sem_carteira
    nome: Sem carteira de direitos creditórios informada
    grupo: Outros
    regras:
      - sem_carteira: true

  - id: outros
    nome: Outros / não classificado
    grupo: Outros
    regras:
      - revisar: true
