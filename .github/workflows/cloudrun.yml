# Publica o Analisador no Google Cloud Run (versão de testes do time).
# Roda a cada push no branch, todo dia às 7h (para pegar o informe novo da CVM) e manualmente (Actions > Run workflow).
# Enquanto os secrets não estiverem cadastrados, o job só avisa e sai sem erro. Passo a passo: docs/deploy-cloud-run.md
name: Publicar no Cloud Run

on:
  push:
    branches: [claude/fidc-analyzer-s3kbfx]
  schedule:
    - cron: "0 10 * * *"        # 10h UTC = 7h em Brasília
  workflow_dispatch:

concurrency:
  group: cloudrun
  cancel-in-progress: true

env:
  REGIAO: us-central1           # região "Tier 1": cota grátis maior que São Paulo
  SERVICO: fidc
  REPO: fidc

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Conferir configuração
        id: cfg
        env:
          CHAVE: ${{ secrets.GCP_SA_KEY }}
          PROJETO: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$PROJETO" ]; then
            echo "::notice::Cloud Run ainda não configurado (faltam GCP_SA_KEY e/ou GCP_PROJECT_ID). Veja docs/deploy-cloud-run.md"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == '1'

      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ok == '1'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.ok == '1'

      - name: Construir a imagem (inclui o ETL completo)
        if: steps.cfg.outputs.ok == '1'
        run: |
          IMG="$REGIAO-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$REPO/app:${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet
          docker build -f Dockerfile.cloudrun -t "$IMG" .
          docker push "$IMG"

      - name: Publicar
        if: steps.cfg.outputs.ok == '1'
        env:
          SENHA: ${{ secrets.FIDC_SENHA }}
          FEEDBACK: ${{ secrets.FIDC_FEEDBACK_URL }}
        run: |
          if [ -z "$SENHA" ]; then echo "::error::Cadastre o secret FIDC_SENHA (senha do time) antes de publicar."; exit 1; fi
          gcloud run deploy "$SERVICO" --image "$IMG" --region "$REGIAO" --project "${{ vars.GCP_PROJECT_ID }}" \
            --memory 2Gi --cpu 1 --min-instances 0 --max-instances 2 --concurrency 20 --timeout 300 \
            --allow-unauthenticated --quiet \
            --update-env-vars "^##^FIDC_SENHA=$SENHA##FIDC_FEEDBACK_URL=$FEEDBACK##FIDC_VERSAO=${GITHUB_SHA::7}"
          echo "### Publicado" >> "$GITHUB_STEP_SUMMARY"
          gcloud run services describe "$SERVICO" --region "$REGIAO" --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(status.url)' >> "$GITHUB_STEP_SUMMARY"
